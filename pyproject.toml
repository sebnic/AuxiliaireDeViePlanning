[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planning-aux"
version = "0.1.0"
description = "Synchronise les horaires d'auxiliaire de vie (Ximi) vers Google Calendar"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12", "google-auth>=2", "google-api-python-client>=2"]

[project.scripts]
planning-aux = "planning_aux.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
